<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Bullo, mascotte de BSCompany">
  <defs>
    <linearGradient id="bullo-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#49B8DB"/>
      <stop offset="100%" stop-color="#1689B9"/>
    </linearGradient>
    <linearGradient id="bullo-body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#65D5F4"/>
      <stop offset="55%" stop-color="#27B2E1"/>
      <stop offset="100%" stop-color="#0878AD"/>
    </linearGradient>
    <linearGradient id="bullo-cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF91A6"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <clipPath id="bullo-face-clip">
      <path d="M76 188 C78 103 132 57 200 57 C268 57 322 103 324 188 L319 275 C315 321 271 350 200 350 C129 350 85 321 81 275 Z"/>
    </clipPath>
  </defs>

  <!-- Arms -->
  <path d="M91 239 C69 241 56 257 62 273 C66 284 79 281 91 265 L107 253 Z"
        fill="url(#bullo-shadow)" stroke="#101820" stroke-width="6" stroke-linejoin="round"/>
  <path d="M309 239 C331 241 344 257 338 273 C334 284 321 281 309 265 L293 253 Z"
        fill="url(#bullo-shadow)" stroke="#101820" stroke-width="6" stroke-linejoin="round"/>

  <!-- Feet -->
  <path d="M151 326 L143 349 Q133 357 139 365 Q153 373 174 350 L179 336 Z"
        fill="url(#bullo-shadow)" stroke="#101820" stroke-width="6" stroke-linejoin="round"/>
  <path d="M249 326 L257 349 Q267 357 261 365 Q247 373 226 350 L221 336 Z"
        fill="url(#bullo-shadow)" stroke="#101820" stroke-width="6" stroke-linejoin="round"/>

  <!-- Body -->
  <path d="M76 188 C78 103 132 57 200 57 C268 57 322 103 324 188 L319 275 C315 321 271 350 200 350 C129 350 85 321 81 275 Z"
        fill="url(#bullo-body)" stroke="#101820" stroke-width="7" stroke-linejoin="round"/>

  <!-- Highlights -->
  <path d="M119 128 C139 94 166 80 194 78"
        fill="none" stroke="#D5F8FF" stroke-width="11" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="110" cy="151" rx="7" ry="13" fill="#FFFFFF" opacity=".65"
           transform="rotate(25 110 151)"/>
  <path d="M105 284 C128 320 165 334 200 334"
        fill="none" stroke="#075F91" stroke-width="5" stroke-linecap="round" opacity=".35"/>

  <!-- Face -->
  <g clip-path="url(#bullo-face-clip)">
    <ellipse cx="112" cy="228" rx="23" ry="14" fill="url(#bullo-cheek)"/>
    <ellipse cx="288" cy="228" rx="23" ry="14" fill="url(#bullo-cheek)"/>

    <ellipse cx="151" cy="195" rx="22" ry="27" fill="#FFFFFF"/>
    <ellipse cx="249" cy="195" rx="22" ry="27" fill="#FFFFFF"/>

    <g id="bullo-pupil-left">
      <ellipse cx="155" cy="199" rx="11" ry="17" fill="#101820"/>
      <ellipse cx="158" cy="192" rx="4" ry="5" fill="#FFFFFF"/>
    </g>
    <g id="bullo-pupil-right">
      <ellipse cx="253" cy="199" rx="11" ry="17" fill="#101820"/>
      <ellipse cx="256" cy="192" rx="4" ry="5" fill="#FFFFFF"/>
    </g>

    <path d="M126 177 C137 165 160 163 174 179"
          fill="none" stroke="#101820" stroke-width="7" stroke-linecap="round"/>
    <path d="M226 179 C240 163 263 165 274 177"
          fill="none" stroke="#101820" stroke-width="7" stroke-linecap="round"/>

    <path d="M174 228 Q200 239 226 228 L222 257 Q200 286 178 257 Z"
          fill="#D9273D" stroke="#101820" stroke-width="5" stroke-linejoin="round"/>
    <path d="M180 257 Q200 269 220 257 Q212 279 200 279 Q188 279 180 257 Z"
          fill="#FF8B9C"/>
  </g>
</svg>
