<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Romans — BSCompany</title>

  <link rel="stylesheet" href="css/main.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=3">

  <style>
    /* ================================
       OUTILS DU CATALOGUE
       ================================ */

    .catalogue-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    .catalogue-search {
      flex: 1;
      min-width: 220px;
    }

    .catalogue-search input,
    .catalogue-tools select {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .catalogue-search input:focus,
    .catalogue-tools select:focus {
      border-color: #7c3aed;
    }

    .catalogue-filter {
      width: 180px;
    }

    .catalogue-count {
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--slate-400);
    }


    /* ================================
       CATALOGUE DES ROMANS
       CARTES COMPACTES
       ================================ */

    #romans-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(170px, 200px));

      justify-content: center;

      gap: 22px 18px;
      width: 100%;
    }

    #romans-grid .story-card {
      width: 100%;
      min-width: 0;
      height: auto;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    #romans-grid .story-top {
      display: flex;
      flex-direction: column;

      padding: 0;
      gap: 0;
    }

    #romans-grid .story-cover {
      width: 100%;
      height: auto;

      aspect-ratio: 2 / 3;

      flex-shrink: 0;

      border-radius: 0;
      overflow: hidden;
    }

    #romans-grid .story-cover img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;
    }

    #romans-grid .story-info {
      padding: 10px 11px 9px;
      min-width: 0;
    }

    #romans-grid .type-badge {
      font-size: 10px;
      padding: 4px 7px;
    }

    #romans-grid .story-title {
      font-size: 14px;
      line-height: 1.3;

      margin-top: 7px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    #romans-grid .story-desc {
      display: none;
    }

    #romans-grid .story-time {
      font-size: 10px;
      margin-top: 6px;
    }

    #romans-grid .story-footer {
      padding: 8px 10px;
      font-size: 11px;
    }

    #romans-grid .story-stats {
      gap: 9px;
    }


    /* ================================
       TABLETTE / PETITS ÉCRANS
       ================================ */

    @media (max-width: 700px) {

      #romans-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        max-width: 420px;
        margin: 0 auto;

        gap: 16px 12px;
      }

      .catalogue-filter {
        width: 100%;
      }

    }


    /* ================================
       PETITS TÉLÉPHONES
       ================================ */

    @media (max-width: 380px) {

      #romans-grid {
        gap: 14px 10px;
      }

    }
  </style>
</head>


<body>

  <!-- =========================
       NAVBAR
       ========================= -->

  <header class="navbar">

    <div class="brand">
      <div>
        <div class="brand-title">BSCompany</div>
        <div class="brand-slogan">
          PARTAGEZ VOTRE BULLE
        </div>
      </div>
    </div>


    <nav class="nav-links">

      <a href="index.html">
        Accueil
      </a>

      <a href="webcomic.html">
        Webcomics
      </a>

      <a href="romans.html" class="active">
        Romans
      </a>

      <a href="a-propos.html">
        À propos de nous
      </a>

    </nav>


    <button
      class="mobile-menu-btn"
      id="mobileMenuBtn"
      type="button"
      aria-label="Ouvrir le menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <div class="nav-actions">

      <a
        class="btn-primary"
        href="https://whatsapp.com/channel/0029VbBGxSU6rsQxlv5ldD3F"
        target="_blank"
        rel="noopener"
      >
        Nous suivre
      </a>

    </div>

  </header>


  <!-- =========================
       CATALOGUE ROMANS
       ========================= -->

  <main class="container">

    <section class="section-header">

      <div>

        <h1 class="section-title">
          Nos <span>Romans</span>
        </h1>

        <p class="section-sub">
          Découvrez toutes les histoires disponibles sur BSCompany.
        </p>

      </div>

    </section>


    <!-- =========================
         OUTILS DE RECHERCHE
         ========================= -->

    <section class="catalogue-tools">

      <div class="catalogue-search">

        <input
          type="search"
          id="searchInput"
          placeholder="Rechercher un roman..."
          autocomplete="off"
        >

      </div>


      <div class="catalogue-filter">

        <select id="genreFilter">

          <option value="all">
            Tous les genres
          </option>

        </select>

      </div>


      <div class="catalogue-filter">

        <select id="sortSelect">

          <option value="recent">
            Plus récents
          </option>

          <option value="popular">
            Plus populaires
          </option>

        </select>

      </div>

    </section>


    <!-- =========================
         COMPTEUR
         ========================= -->

    <div
      id="resultsCount"
      class="catalogue-count"
    >
      Chargement...
    </div>


    <!-- =========================
         GRILLE DES ROMANS
         ========================= -->

    <section
      id="romans-grid"
      class="recent-grid"
      aria-live="polite"
    >

      <p class="empty-state">
        Chargement des romans...
      </p>

    </section>

  </main>


  <!-- =========================
       MENU MOBILE
       ========================= -->

  <script>

    const mobileMenuBtn =
      document.getElementById('mobileMenuBtn');

    const navLinks =
      document.querySelector('.nav-links');


    if (mobileMenuBtn && navLinks) {

      mobileMenuBtn.addEventListener(
        'click',
        () => {

          const isOpen =
            navLinks.classList.toggle('mobile-open');


          mobileMenuBtn.setAttribute(
            'aria-expanded',
            String(isOpen)
          );


          mobileMenuBtn.setAttribute(
            'aria-label',
            isOpen
              ? 'Fermer le menu'
              : 'Ouvrir le menu'
          );


          mobileMenuBtn.textContent =
            isOpen ? '✕' : '☰';

        }
      );


      navLinks
        .querySelectorAll('a')
        .forEach(link => {

          link.addEventListener(
            'click',
            () => {

              navLinks.classList.remove(
                'mobile-open'
              );


              mobileMenuBtn.setAttribute(
                'aria-expanded',
                'false'
              );


              mobileMenuBtn.setAttribute(
                'aria-label',
                'Ouvrir le menu'
              );


              mobileMenuBtn.textContent = '☰';

            }
          );

        });

    }

  </script>


  <!-- =========================
       SUPABASE + CATALOGUE
       ========================= -->

  <script type="module">

    import { supabase }
      from './js/config/supabase.js';

    import { createCard }
      from './js/components/card.js';


    const romansGrid =
      document.getElementById('romans-grid');

    const searchInput =
      document.getElementById('searchInput');

    const genreFilter =
      document.getElementById('genreFilter');

    const sortSelect =
      document.getElementById('sortSelect');

    const resultsCount =
      document.getElementById('resultsCount');


    let allRomans = [];


    /* =========================
       RÉCUPÉRER LES VUES
       ========================= */

    async function attachSeriesViews(series) {

      if (!series || series.length === 0) {
        return [];
      }


      const seriesIds =
        series.map(roman => roman.id);


      /* =========================
         RÉCUPÉRER LES CHAPITRES
         ========================= */

      const {
        data: chapters,
        error: chaptersError
      } = await supabase

        .from('chapters')

        .select('id, series_id')

        .in('series_id', seriesIds);


      if (chaptersError) {

        console.error(
          'Erreur lors de la récupération des chapitres :',
          chaptersError
        );

        throw chaptersError;

      }


      /* Aucun chapitre = 0 vue */

      if (!chapters || chapters.length === 0) {

        return series.map(roman => ({

          ...roman,

          views: 0,

          vues: 0

        }));

      }


      const chapterIds =
        chapters.map(
          chapter => chapter.id
        );


      /* =========================
         RÉCUPÉRER LES VUES
         ========================= */

      const {
        data: views,
        error: viewsError
      } = await supabase

        .from('chapter_views')

        .select('chapter_id')

        .in('chapter_id', chapterIds);


      if (viewsError) {

        console.error(
          'Erreur lors de la récupération des vues :',
          viewsError
        );

        throw viewsError;

      }


      /* =========================
         COMPTER LES VUES
         PAR CHAPITRE
         ========================= */

      const viewsByChapter = {};


      (views || []).forEach(view => {

        if (!view.chapter_id) {
          return;
        }


        viewsByChapter[view.chapter_id] =
          (viewsByChapter[view.chapter_id] || 0) + 1;

      });


      /* =========================
         ADDITIONNER LES VUES
         PAR ROMAN
         ========================= */

      const viewsBySeries = {};


      chapters.forEach(chapter => {

        const chapterViews =
          viewsByChapter[chapter.id] || 0;


        viewsBySeries[chapter.series_id] =
          (viewsBySeries[chapter.series_id] || 0) +
          chapterViews;

      });


      /* =========================
         AJOUTER LES VUES
         AUX ROMANS
         ========================= */

      return series.map(roman => {

        const totalViews =
          viewsBySeries[roman.id] || 0;


        return {

          ...roman,

          views: totalViews,

          vues: totalViews

        };

      });

    }


    /* =========================
       RÉCUPÉRER LES LIKES
       ========================= */

    async function attachSeriesLikes(series) {

      if (!series || series.length === 0) {
        return [];
      }


      const seriesIds =
        series.map(roman => roman.id);


      /* =========================
         RÉCUPÉRER LES CHAPITRES
         ========================= */

      const {
        data: chapters,
        error: chaptersError
      } = await supabase

        .from('chapters')

        .select('id, series_id')

        .in('series_id', seriesIds);


      if (chaptersError) {

        console.error(
          'Erreur lors de la récupération des chapitres pour les likes :',
          chaptersError
        );

        throw chaptersError;

      }


      /* Aucun chapitre = 0 like */

      if (!chapters || chapters.length === 0) {

        return series.map(roman => ({

          ...roman,

          likes: 0

        }));

      }


      const chapterIds =
        chapters.map(
          chapter => chapter.id
        );


      /* =========================
         RÉCUPÉRER LES LIKES
         ========================= */

      const {
        data: likes,
        error: likesError
      } = await supabase

        .from('likes')

        .select('chapter_id')

        .in('chapter_id', chapterIds);


      if (likesError) {

        console.error(
          'Erreur lors de la récupération des likes :',
          likesError
        );

        throw likesError;

      }


      /* =========================
         COMPTER LES LIKES
         PAR CHAPITRE
         ========================= */

      const likesByChapter = {};


      (likes || []).forEach(like => {

        if (!like.chapter_id) {
          return;
        }


        likesByChapter[like.chapter_id] =
          (likesByChapter[like.chapter_id] || 0) + 1;

      });


      /* =========================
         ADDITIONNER LES LIKES
         PAR ROMAN
         ========================= */

      const likesBySeries = {};


      chapters.forEach(chapter => {

        const chapterLikes =
          likesByChapter[chapter.id] || 0;


        likesBySeries[chapter.series_id] =
          (likesBySeries[chapter.series_id] || 0) +
          chapterLikes;

      });


      /* =========================
         AJOUTER LES LIKES
         AUX ROMANS
         ========================= */

      return series.map(roman => {

        const totalLikes =
          likesBySeries[roman.id] || 0;


        return {

          ...roman,

          likes: totalLikes

        };

      });

    }


    /* =========================
       CHARGEMENT DES ROMANS
       ========================= */

    async function loadRomans() {

      try {

        const {
          data: series,
          error
        } = await supabase

          .from('series')

          .select('*')

          .eq('type', 'novel');


        if (error) {

          console.error(
            'Erreur Supabase (romans):',
            error
          );


          romansGrid.innerHTML = `
            <p class="error-state">
              Impossible de charger les romans
              pour le moment.
            </p>
          `;

          resultsCount.textContent = '';

          return;

        }


        /*
          On récupère maintenant les vues
          réelles depuis chapter_views.
        */

        allRomans =
          await attachSeriesViews(
            series || []
          );


        /*
          On récupère maintenant les likes
          réels depuis likes.
        */

        allRomans =
          await attachSeriesLikes(
            allRomans
          );


        if (allRomans.length === 0) {

          romansGrid.innerHTML = `
            <p class="empty-state">
              Aucun roman n'est disponible
              pour le moment.
            </p>
          `;

          resultsCount.textContent =
            '0 roman';

          return;

        }


        populateGenres();

        renderRomans();

      }

      catch (error) {

        console.error(
          'Erreur inattendue lors du chargement des romans:',
          error
        );


        romansGrid.innerHTML = `
          <p class="error-state">
            Impossible de contacter la base de données.
            Vérifie ta connexion et réessaie.
          </p>
        `;


        resultsCount.textContent = '';

      }

    }


    /* =========================
       GENRES
       ========================= */

    function populateGenres() {

      const genres = new Set();


      allRomans.forEach(roman => {

        if (!roman.genre) {
          return;
        }


        roman.genre
          .split(',')
          .map(genre => genre.trim())
          .filter(Boolean)
          .forEach(genre => {

            genres.add(genre);

          });

      });


      const sortedGenres =
        [...genres].sort(
          (a, b) => a.localeCompare(b)
        );


      genreFilter.innerHTML = `
        <option value="all">
          Tous les genres
        </option>
      `;


      sortedGenres.forEach(genre => {

        const option =
          document.createElement('option');


        option.value = genre;

        option.textContent = genre;


        genreFilter.appendChild(option);

      });

    }


    /* =========================
       AFFICHAGE
       ========================= */

    function renderRomans() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const selectedGenre =
        genreFilter.value;


      const sort =
        sortSelect.value;


      let romans =
        [...allRomans];


      /* =========================
         RECHERCHE
         ========================= */

      if (search) {

        romans =
          romans.filter(roman => {

            const title =
              roman.title || '';


            const description =
              roman.description || '';


            const genre =
              roman.genre || '';


            const content = `
              ${title}
              ${description}
              ${genre}
            `.toLowerCase();


            return content.includes(search);

          });

      }


      /* =========================
         FILTRE GENRE
         ========================= */

      if (selectedGenre !== 'all') {

        romans =
          romans.filter(roman => {

            if (!roman.genre) {
              return false;
            }


            return roman.genre
              .split(',')
              .map(g => g.trim())
              .includes(selectedGenre);

          });

      }


      /* =========================
         TRI
         ========================= */

      if (sort === 'popular') {

        romans.sort((a, b) => {

          const viewsA =
            Number(
              a.views ??
              a.vues ??
              0
            );


          const viewsB =
            Number(
              b.views ??
              b.vues ??
              0
            );


          return viewsB - viewsA;

        });

      }

      else {

        romans.sort((a, b) => {

          const dateA =
            new Date(
              a.created_at || 0
            ).getTime();


          const dateB =
            new Date(
              b.created_at || 0
            ).getTime();


          return dateB - dateA;

        });

      }


      /* =========================
         COMPTEUR
         ========================= */

      const count =
        romans.length;


      resultsCount.textContent =
        `${count} roman${count > 1 ? 's' : ''}`;


      /* =========================
         AUCUN RÉSULTAT
         ========================= */

      if (count === 0) {

        romansGrid.innerHTML = `
          <p class="empty-state">
            Aucun roman ne correspond
            à votre recherche.
          </p>
        `;

        return;

      }


      /* =========================
         CARTES
         ========================= */

      romansGrid.innerHTML =
        romans
          .map(roman => createCard(roman))
          .join('');

    }


    /* =========================
       ÉVÉNEMENTS
       ========================= */

    searchInput.addEventListener(
      'input',
      renderRomans
    );


    genreFilter.addEventListener(
      'change',
      renderRomans
    );


    sortSelect.addEventListener(
      'change',
      renderRomans
    );


    /* =========================
       LANCEMENT
       ========================= */

    loadRomans();

  </script>

</body>
</html>
