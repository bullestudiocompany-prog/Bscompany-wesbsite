<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Romans — BSCompany</title>

  <link rel="stylesheet" href="css/main.css?v=4">
  <link rel="stylesheet" href="css/components.css?v=4">

  <style>
    /* =========================
       CATALOGUE ROMANS
    ========================= */

    .romans-intro {
      margin-bottom: 28px;
    }

    .romans-intro .section-title {
      margin-bottom: 8px;
    }

    .romans-intro .section-sub {
      max-width: 650px;
    }

    /* =========================
       OUTILS DE RECHERCHE
    ========================= */

    .catalogue-tools {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 12px;
      margin-bottom: 26px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    .search-box {
      position: relative;
    }

    .search-box input,
    .catalogue-select {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--ink);
      padding: 0 14px;
      outline: none;
      font: inherit;
    }

    .search-box input {
      padding-left: 42px;
    }

    .search-box input:focus,
    .catalogue-select:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.10);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate-400);
      pointer-events: none;
    }

    .catalogue-select {
      min-width: 170px;
      cursor: pointer;
    }

    .results-count {
      margin: 0 0 16px;
      color: var(--slate-600);
      font-size: 13px;
    }

    /* =========================
       GRILLE ROMANS
    ========================= */

    #romans-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    /* Transformation visuelle des cartes existantes
       sans modifier le composant global */
    #romans-grid .story-card {
      min-width: 0;
      height: 100%;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    #romans-grid .story-card:hover {
      transform: translateY(-5px);
      border-color: #cbd8f4;
      box-shadow: 0 18px 38px rgba(16, 22, 43, 0.12);
    }

    #romans-grid .story-top {
      flex-direction: column;
      padding: 0;
      gap: 0;
    }

    #romans-grid .story-cover {
      width: 100%;
      height: 245px;
      border-radius: 0;
      background: var(--bg);
    }

    #romans-grid .story-cover img {
      transition: transform .25s ease;
    }

    #romans-grid .story-card:hover .story-cover img {
      transform: scale(1.03);
    }

    #romans-grid .story-info {
      padding: 14px 15px 12px;
    }

    #romans-grid .story-title {
      font-size: 15px;
      margin-top: 8px;
      -webkit-line-clamp: 2;
      line-height: 1.35;
    }

    #romans-grid .story-desc {
      font-size: 12px;
      margin-top: 7px;
      -webkit-line-clamp: 3;
    }

    #romans-grid .story-time {
      margin-top: 9px;
    }

    #romans-grid .story-footer {
      margin-top: auto;
    }

    /* =========================
       ÉTAT VIDE
    ========================= */

    .romans-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 20px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    .romans-empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .romans-empty h3 {
      margin: 0 0 7px;
      color: var(--ink);
      font-size: 18px;
    }

    .romans-empty p {
      margin: 0;
      color: var(--slate-400);
      font-size: 13px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {
      #romans-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .catalogue-tools {
        grid-template-columns: 1fr 1fr;
      }

      .search-box {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 700px) {
      #romans-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      #romans-grid .story-cover {
        height: 230px;
      }

      .catalogue-tools {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .search-box {
        grid-column: auto;
      }

      .catalogue-select {
        min-width: 0;
      }
    }

    @media (max-width: 480px) {
      #romans-grid {
        grid-template-columns: 1fr;
      }

      #romans-grid .story-cover {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================= -->

  <header class="navbar">

    <div class="brand">
      <div>
        <div class="brand-title">BSCompany</div>
        <div class="brand-slogan">PARTAGEZ VOTRE BULLE</div>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="webcomic.html">Webcomics</a>
      <a href="romans.html" class="active">Romans</a>
      <a href="a-propos.html">À propos de nous</a>
    </nav>

    <button
      class="mobile-menu-btn"
      id="mobileMenuBtn"
      type="button"
      aria-label="Ouvrir le menu"
      aria-expanded="false"
    >
      ☰
    </button>

    <div class="nav-actions">
      <a
        class="btn-primary"
        href="https://whatsapp.com/channel/0029VbBGxSU6rsQxlv5ldD3F"
        target="_blank"
        rel="noopener"
      >
        Nous suivre
      </a>
    </div>

  </header>


  <!-- =========================
       CONTENU
  ========================= -->

  <main class="container">

    <section class="romans-intro section-header">

      <div>
        <h1 class="section-title">
          Nos <span>Romans</span>
        </h1>

        <p class="section-sub">
          Découvrez toutes les histoires disponibles sur BSCompany.
        </p>
      </div>

    </section>


    <!-- =========================
         RECHERCHE + FILTRES
    ========================= -->

    <section class="catalogue-tools">

      <div class="search-box">

        <span class="search-icon">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher un roman..."
          autocomplete="off"
        >

      </div>


      <select id="genreFilter" class="catalogue-select">
        <option value="all">Tous les genres</option>
      </select>


      <select id="sortSelect" class="catalogue-select">

        <option value="recent">
          Plus récent
        </option>

        <option value="popular">
          Plus populaire
        </option>

      </select>

    </section>


    <p
      id="resultsCount"
      class="results-count"
      aria-live="polite"
    >
      Chargement des romans...
    </p>


    <!-- =========================
         GRILLE
    ========================= -->

    <section
      id="romans-grid"
      aria-live="polite"
    >
      <div class="romans-empty">
        <div class="romans-empty-icon">📚</div>
        <h3>Chargement des romans...</h3>
        <p>Un instant...</p>
      </div>
    </section>

  </main>


  <!-- =========================
       MENU MOBILE
  ========================= -->

  <script>

    const mobileMenuBtn =
      document.getElementById('mobileMenuBtn');

    const navLinks =
      document.querySelector('.nav-links');

    if (mobileMenuBtn && navLinks) {

      mobileMenuBtn.addEventListener('click', () => {

        const isOpen =
          navLinks.classList.toggle('mobile-open');

        mobileMenuBtn.setAttribute(
          'aria-expanded',
          String(isOpen)
        );

        mobileMenuBtn.setAttribute(
          'aria-label',
          isOpen
            ? 'Fermer le menu'
            : 'Ouvrir le menu'
        );

        mobileMenuBtn.textContent =
          isOpen ? '✕' : '☰';

      });


      navLinks.querySelectorAll('a').forEach(link => {

        link.addEventListener('click', () => {

          navLinks.classList.remove('mobile-open');

          mobileMenuBtn.setAttribute(
            'aria-expanded',
            'false'
          );

          mobileMenuBtn.setAttribute(
            'aria-label',
            'Ouvrir le menu'
          );

          mobileMenuBtn.textContent = '☰';

        });

      });

    }

  </script>


  <!-- =========================
       SUPABASE + CATALOGUE
  ========================= -->

  <script type="module">

    import { supabase }
      from './js/config/supabase.js';

    import { createCard }
      from './js/components/card.js';


    const romansGrid =
      document.getElementById('romans-grid');

    const searchInput =
      document.getElementById('searchInput');

    const genreFilter =
      document.getElementById('genreFilter');

    const sortSelect =
      document.getElementById('sortSelect');

    const resultsCount =
      document.getElementById('resultsCount');


    let allRomans = [];


    /* =========================
       NORMALISATION
    ========================= */

    function normalizeText(value) {

      return (value || '')
        .toString()
        .trim()
        .toLowerCase();

    }


    /* =========================
       GENRES
    ========================= */

    function extractGenres(romans) {

      const genres = new Set();

      romans.forEach(roman => {

        const rawGenre =
          roman.genre || '';

        rawGenre
          .split(',')
          .map(genre => genre.trim())
          .filter(Boolean)
          .forEach(genre => {
            genres.add(genre);
          });

      });

      return [...genres].sort(
        (a, b) => a.localeCompare(b, 'fr')
      );

    }


    function populateGenreFilter() {

      const genres =
        extractGenres(allRomans);

      genreFilter.innerHTML = `
        <option value="all">
          Tous les genres
        </option>
      `;

      genres.forEach(genre => {

        const option =
          document.createElement('option');

        option.value = genre;
        option.textContent = genre;

        genreFilter.appendChild(option);

      });

    }


    /* =========================
       AFFICHAGE
    ========================= */

    function renderRomans() {

      const search =
        normalizeText(searchInput.value);

      const selectedGenre =
        genreFilter.value;

      const sort =
        sortSelect.value;


      let filteredRomans =
        [...allRomans];


      /* RECHERCHE */

      if (search) {

        filteredRomans =
          filteredRomans.filter(roman => {

            const title =
              normalizeText(roman.title);

            const description =
              normalizeText(roman.description);

            const genre =
              normalizeText(roman.genre);

            return (
              title.includes(search) ||
              description.includes(search) ||
              genre.includes(search)
            );

          });

      }


      /* GENRE */

      if (selectedGenre !== 'all') {

        filteredRomans =
          filteredRomans.filter(roman => {

            const genres =
              (roman.genre || '')
                .split(',')
                .map(g => normalizeText(g));

            return genres.includes(
              normalizeText(selectedGenre)
            );

          });

      }


      /* TRI */

      if (sort === 'popular') {

        filteredRomans.sort(
          (a, b) =>
            Number(b.views ?? b.vues ?? 0) -
            Number(a.views ?? a.vues ?? 0)
        );

      } else {

        filteredRomans.sort(
          (a, b) =>
            new Date(b.created_at || 0) -
            new Date(a.created_at || 0)
        );

      }


      /* COMPTEUR */

      resultsCount.textContent =
        filteredRomans.length === 0
          ? 'Aucun roman trouvé'
          : `${filteredRomans.length} roman${filteredRomans.length > 1 ? 's' : ''}`;


      /* ÉTAT VIDE */

      if (filteredRomans.length === 0) {

        romansGrid.innerHTML = `
          <div class="romans-empty">

            <div class="romans-empty-icon">
              🔎
            </div>

            <h3>
              Aucun roman trouvé
            </h3>

            <p>
              Essaie avec un autre titre,
              un autre genre ou une autre recherche.
            </p>

          </div>
        `;

        return;

      }


      /* CARTES */

      romansGrid.innerHTML =
        filteredRomans
          .map(roman => createCard(roman))
          .join('');

    }


    /* =========================
       CHARGEMENT SUPABASE
    ========================= */

    async function loadRomans() {

      try {

        const {
          data: series,
          error
        } = await supabase

          .from('series')

          .select('*')

          .eq('type', 'novel');


        if (error) {

          console.error(
            'Erreur Supabase (romans):',
            error
          );

          resultsCount.textContent =
            'Erreur lors du chargement';

          romansGrid.innerHTML = `
            <div class="romans-empty">

              <div class="romans-empty-icon">
                ⚠️
              </div>

              <h3>
                Impossible de charger les romans
              </h3>

              <p>
                Vérifie ta connexion et réessaie.
              </p>

            </div>
          `;

          return;

        }


        allRomans = series || [];


        if (allRomans.length === 0) {

          resultsCount.textContent =
            '0 roman';

          romansGrid.innerHTML = `
            <div class="romans-empty">

              <div class="romans-empty-icon">
                📚
              </div>

              <h3>
                Aucun roman disponible
              </h3>

              <p>
                Les premiers romans de BSCompany
                arriveront bientôt.
              </p>

            </div>
          `;

          return;

        }


        populateGenreFilter();

        renderRomans();


      } catch (error) {

        console.error(
          'Erreur inattendue:',
          error
        );

        resultsCount.textContent =
          'Erreur lors du chargement';

        romansGrid.innerHTML = `
          <div class="romans-empty">

            <div class="romans-empty-icon">
              ⚠️
            </div>

            <h3>
              Une erreur est survenue
            </h3>

            <p>
              Impossible de contacter la base de données.
            </p>

          </div>
        `;

      }

    }


    /* =========================
       ÉVÉNEMENTS
    ========================= */

    searchInput.addEventListener(
      'input',
      renderRomans
    );

    genreFilter.addEventListener(
      'change',
      renderRomans
    );

    sortSelect.addEventListener(
      'change',
      renderRomans
    );


    loadRomans();

  </script>

</body>
  </html>
