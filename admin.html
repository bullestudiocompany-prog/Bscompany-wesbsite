<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BSCompany — Administration</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Arial, sans-serif; background: #080b12; color: white; min-height: 100vh; padding: 25px; } .container { max-width: 700px; margin: auto; } h1 { text-align: center; margin-bottom: 25px; color: #3b82f6; } .box { background: #111722; border: 1px solid #202a3a; border-radius: 15px; padding: 25px; margin-bottom: 20px; } h2 { margin-bottom: 20px; } input, textarea, select, button { width: 100%; padding: 13px; margin-top: 8px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #293548; background: #0b1019; color: white; font-size: 15px; } textarea { min-height: 120px; resize: vertical; } button { background: #2563eb; border: none; cursor: pointer; font-weight: bold; } button:hover { background: #1d4ed8; } button:disabled { opacity: .6; } label { font-size: 13px; color: #aeb8c8; } .hidden { display: none; } #loginError, #statusMsg { margin-top: 5px; font-size: 14px; } #logoutBtn { background: #dc2626; } </style> </head> <body> <div class="container"> <h1>BSCompany Admin</h1> <!-- CONNEXION --> <section id="loginSection" class="box"> <h2>Connexion</h2> <form id="loginForm"> <label>Email</label> <input type="email" id="loginEmail" placeholder="admin@email.com" required > <label>Mot de passe</label> <input type="password" id="loginPassword" placeholder="Mot de passe" required > <button type="submit"> Se connecter </button> <p id="loginError"></p> </form> </section> <!-- ADMIN --> <section id="adminSection" class="box hidden"> <h2>Publier une œuvre</h2> <form id="addBookForm"> <label>Titre</label> <input type="text" id="title" placeholder="Titre de l'œuvre" required > <label>Sous-titre</label> <input type="text" id="subtitle" placeholder="Sous-titre" > <label>Auteur</label> <input type="text" id="author" placeholder="Nom de l'auteur" > <label>Type</label> <select id="type"> <option value="WEBNOVEL">Webnovel</option> <option value="ROMAN">Roman</option> </select> <label>Genre</label> <input type="text" id="genre" placeholder="Action, Fantasy, Romance..." required > <label>Statut</label> <select id="status"> <option value="En cours">En cours</option> <option value="Terminé">Terminé</option> </select> <label>Couverture</label> <input type="file" id="coverFile" accept="image/*" required > <label>Description</label> <textarea id="description" placeholder="Description de l'œuvre..." required ></textarea> <button id="submitBtn" type="submit"> Publier le livre </button> <p id="statusMsg"></p> </form> <button id="logoutBtn" class="hidden"> Se déconnecter </button> </section> </div> <!-- Supabase --> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <!-- Ton JavaScript --> <script src="admin.js"></script> </body> </html>
