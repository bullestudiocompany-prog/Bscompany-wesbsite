<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSCompany - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SDK Supabase Officiel -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .admin-nav {  
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 2rem; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
        }

        .container { max-width: 650px; margin: 2.5rem auto; width: 90%; }

        .admin-card {
            background: var(--card-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        input, select, textarea {
            width: 100%; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 16px; color: var(--text-main); margin-top: 0.4rem;
            outline: none;
        }

        .form-group { margin-bottom: 1.2rem; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

        .btn-submit {
            width: 100%; background: var(--primary-gradient); color: #fff;
            border: none; padding: 14px; font-weight: 700; border-radius: 12px;
            cursor: pointer; margin-top: 1rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="admin-nav">
        <div style="font-weight: 800;">✨ BSCompany Admin</div>
        <button id="logoutBtn" class="hidden" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Déconnexion</button>
    </nav>

    <main class="container">
        <!-- FORMULAIRE DE CONNEXION -->
        <div id="loginSection" class="admin-card">
            <h2>Connexion Administrateur</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Saisis tes accès administrateur.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" required placeholder="tonmail@example.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Se connecter</button>
                <p id="loginError" style="margin-top: 1rem; text-align: center; font-size: 0.85rem; font-weight: bold;"></p>
            </form>
        </div>

        <!-- ESPACE DE PUBLICATION -->
        <div id="adminSection" class="admin-card hidden">
            <h2 style="color: #4ade80; margin-bottom: 0.5rem;">🚀 Espace Administration</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Ajoute un nouveau livre ou webnovel au catalogue.</p>
            
            <form id="addBookForm">
                <div class="form-group">
                    <label>Titre de l'œuvre *</label>
                    <input type="text" id="title" required placeholder="Ex: Tika Nameka">
                </div>
                <div class="form-group">
                    <label>Sous-titre</label>
                    <input type="text" id="subtitle">
                </div>
                <div class="form-group">
                    <label>Auteur</label>
                    <input type="text" id="author" placeholder="BSCompany Studio">
                </div>
                <div class="form-group">
                    <label>Type *</label>
                    <select id="type">
                        <option value="WEBNOVEL">WEBNOVEL</option>
                        <option value="ROMAN">ROMAN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Genre *</label>
                    <input type="text" id="genre" placeholder="Romance / Thriller">
                </div>
                <div class="form-group">
                    <label>Statut *</label>
                    <select id="status">
                        <option value="En cours">En cours</option>
                        <option value="Terminé">Terminé</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Couverture (Image) *</label>
                    <input type="file" id="coverFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Résumé *</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Publier le livre</button>
                <div id="statusMsg" style="margin-top: 1rem; text-align: center; font-weight: bold;"></div>
            </form>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://bvehhmbowizwsqrbdnwu.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_B4I-hDnB8ic_IRa7ZRIRMQ_zGrteY2Q';

        // Initialisation du client Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        // Vérification de session au chargement
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
            }
        }

        // Action de connexion
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.color = "#3b82f6";
            loginError.innerText = "Connexion en cours...";

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                loginError.style.color = "#ef4444";
                loginError.innerText = "❌ " + error.message;
            } else {
                loginError.innerText = "";
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
            }
        });

        // Déconnexion
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            location.reload();
        });

        // Publication de livre
        const addBookForm = document.getElementById('addBookForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        addBookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Publication...";

            try {
                const title = document.getElementById('title').value;
                const subtitle = document.getElementById('subtitle').value;
                const author = document.getElementById('author').value || 'BSCompany Studio';
                const type = document.getElementById('type').value;
                const genre = document.getElementById('genre').value;
                const status = document.getElementById('status').value;
                const description = document.getElementById('description').value;
                const fileInput = document.getElementById('coverFile');

                const file = fileInput.files[0];
                const fileName = `${Date.now()}.${file.name.split('.').pop()}`;

                const { error: uploadError } = await supabase.storage.from('covers').upload(fileName, file);
                if (uploadError) throw uploadError;

                const { data: urlData } = supabase.storage.from('covers').getPublicUrl(fileName);

                const { error: insertError } = await supabase.from('works').insert([{
                    title, subtitle, author, type, genre, status, description,
                    cover_url: urlData.publicUrl, read_url: '#'
                }]);

                if (insertError) throw insertError;

                statusMsg.style.color = "#22c55e";
                statusMsg.innerText = "✅ Livre publié avec succès !";
                addBookForm.reset();

            } catch (err) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "❌ Erreur : " + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Publier le livre";
            }
        });

        checkUser();
    </script>
</body>
</html>
