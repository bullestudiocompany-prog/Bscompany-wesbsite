<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BSCompany — Administration</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Arial, sans-serif; background: #080b12; color: white; min-height: 100vh; padding: 25px; } .container { max-width: 700px; margin: auto; } h1 { text-align: center; margin-bottom: 25px; color: #3b82f6; } .box { background: #111722; border: 1px solid #202a3a; border-radius: 15px; padding: 25px; margin-bottom: 20px; } h2 { margin-bottom: 20px; } input, textarea, select, button { width: 100%; padding: 13px; margin-top: 8px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #293548; background: #0b1019; color: white; font-size: 15px; } textarea { min-height: 120px; resize: vertical; } button { background: #2563eb; border: none; cursor: pointer; font-weight: bold; } button:hover { background: #1d4ed8; } button:disabled { opacity: 0.6; cursor: not-allowed; } label { display: block; font-size: 13px; color: #aeb8c8; margin-top: 5px; } .hidden { display: none; } #loginError, #statusMsg { margin-top: 5px; font-size: 14px; min-height: 20px; } #logoutBtn { background: #dc2626; } #logoutBtn:hover { background: #b91c1c; } .logo { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 5px; } .subtitle { text-align: center; color: #8b98aa; margin-bottom: 25px; font-size: 14px; } </style> </head> <body> <div class="container"> <div class="logo">BSCompany</div> <div class="subtitle">Administration</div> <!-- ========================= --> <!-- CONNEXION --> <!-- ========================= --> <section id="loginSection" class="box"> <h2>Connexion</h2> <form id="loginForm"> <label for="loginEmail"> Email </label> <input type="email" id="loginEmail" placeholder="admin@bscompany.com" required > <label for="loginPassword"> Mot de passe </label> <input type="password" id="loginPassword" placeholder="••••••••" required > <button type="submit"> Se connecter </button> <p id="loginError"></p> </form> </section> <!-- ========================= --> <!-- ADMINISTRATION --> <!-- ========================= --> <section id="adminSection" class="box hidden"> <h2>Publier une œuvre</h2> <form id="addBookForm"> <!-- TITRE --> <label for="title"> Titre </label> <input type="text" id="title" placeholder="Titre de l'œuvre" required > <!-- SOUS-TITRE --> <label for="subtitle"> Sous-titre </label> <input type="text" id="subtitle" placeholder="Sous-titre (facultatif)" > <!-- AUTEUR --> <label for="author"> Auteur </label> <input type="text" id="author" placeholder="Nom de l'auteur" > <!-- TYPE --> <label for="type"> Type </label> <select id="type"> <option value="Webnovel"> Webnovel </option> <option value="Roman"> Roman </option> <option value="Webtoon"> Webtoon </option> <option value="Manga"> Manga </option> </select> <!-- GENRE --> <label for="genre"> Genre </label> <input type="text" id="genre" placeholder="Ex : Action, Fantastique, Romance..." required > <!-- STATUT --> <label for="status"> Statut </label> <select id="status"> <option value="En cours"> En cours </option> <option value="Terminé"> Terminé </option> </select> <!-- COUVERTURE --> <label for="coverFile"> Couverture </label> <input type="file" id="coverFile" accept="image/*" required > <!-- DESCRIPTION --> <label for="description"> Description </label> <textarea id="description" placeholder="Description de l'œuvre..." required ></textarea> <!-- BOUTON --> <button type="submit" id="submitBtn" > Publier le livre </button> <p id="statusMsg"></p> </form> </section> <!-- ========================= --> <!-- DÉCONNEXION --> <!-- ========================= --> <button id="logoutBtn" class="hidden" type="button" > Se déconnecter </button> </div> <!-- IMPORTANT : admin.js est un module car il importe SupabaseClient.js --> <script type="module" src="./admin.js" ></script> </body> </html>
